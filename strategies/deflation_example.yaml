# PRZYKŁADOWA strategia na Deflation (start z $20 000, brak dochodu, rundy 31-60).
# Współrzędne i build są PRZYKŁADOWE - przed użyciem:
#   1. zmierz własne pozycje:   python -m btd6bot pos
#   2. sprawdź ręcznie raz, że build wygrywa i mieści się w budżecie na wybranej trudności.

name: deflation_example

# Jak z menu głównego wejść w mapę. Każdy click_template to obrazek z folderu templates/.
start_game:
  - click_template: play            # "Play" w menu głównym
  - click_template: map             # miniatura mapy (musi być widoczna na pierwszej stronie listy;
                                    #  jeśli nie jest, dodaj wcześniej klik w strzałkę / kategorię)
  - click_template: hard            # trudność
  - click_template: deflation       # tryb
  - click_template: ok              # okienko z zasadami trybu (jeśli się pojawia)
    optional: true
    timeout: 5

# Kolejność ma znaczenie: najpierw stawiamy, potem ulepszamy.
# Nazwy wież (tower) muszą być w config.yaml -> hotkeys.towers.
steps:
  - place: {tower: ninja, name: ninja1, at: [0.42, 0.45]}
  - upgrade: {name: ninja1, path: [4, 0, 2]}      # góra-środek-dół (ile razy wcisnąć , . /)

  - place: {tower: bomb, name: bomb1, at: [0.50, 0.55]}
  - upgrade: {name: bomb1, path: [2, 4, 0]}

  - place: {tower: alchemist, name: alch1, at: [0.46, 0.52]}
  - upgrade: {name: alch1, path: [3, 0, 0]}

# Tańsza pętla bez klikania przez menu: po wygranej Next -> Restart (+ potwierdzenie).
# Odkomentuj, jeśli masz szablony 'restart' i 'confirm':
# restart_skips_menu: true
# after_victory:
#   - click_template: next
#   - click_template: restart
#   - click_template: confirm
